services:
  postgres:
    image: postgres:16-alpine
    container_name: toyshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: toyshop
      POSTGRES_PASSWORD: toyshop
      POSTGRES_DB: toyshop
    ports:
      - "5432:5432"
    volumes:
      - toyshop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toyshop -d toyshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: toyshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - toyshop_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  toyshop_postgres_data:
  toyshop_redis_data:
